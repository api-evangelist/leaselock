aid: leaselock
name: LeaseLock
description: LeaseLock is an insurtech platform for rental housing that replaces the traditional cash
  security deposit with lease insurance. Its Zero Deposit program embeds coverage into the lease through
  a signed addendum, removing thousands of dollars of move-in cost for residents while protecting owners
  and operators against unpaid rent and damage. LeaseLock Shield applies AI to ledger data, market trends
  and lease profiles to underwrite risk, and LeaseLock Central gives property teams a portal for claims,
  support tickets and training. Founded in 2016 and headquartered in Dallas, Texas, the company says it
  integrates with all major property management systems, but publishes no public developer API, developer
  portal, API reference or client SDKs — integration is arranged as a managed engagement. Its public
  engineering output is two open-source PostgreSQL extensions, pgasync and pgflow.
